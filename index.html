<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>InterpJud Oral</title>
<meta name="description" content="Entrenador para el examen oral de intérpretes judiciales (español ↔ inglés), República Dominicana.">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="InterpJud">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#eef1f5; --text:#141821; --muted:#5d6675; --border:#dde2ea;
  --primary:#1d4ed8; --primary-ink:#ffffff; --primary-soft:#e3ebff;
  --good:#15803d; --good-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --es:#c2410c; --en:#1d4ed8; --rec:#dc2626;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161b22; --surface-2:#1f2630; --text:#e7eaf0; --muted:#97a1b0; --border:#2a323d;
    --primary:#6d9bff; --primary-ink:#0b1020; --primary-soft:#1a2747;
    --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#33270b; --bad:#f87171; --bad-soft:#3a1517;
    --es:#fb923c; --en:#7aa7ff; --rec:#f87171; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1f2630; --text:#e7eaf0; --muted:#97a1b0; --border:#2a323d;
  --primary:#6d9bff; --primary-ink:#0b1020; --primary-soft:#1a2747;
  --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#33270b; --bad:#f87171; --bad-soft:#3a1517;
  --es:#fb923c; --en:#7aa7ff; --rec:#f87171; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .iconbtn{border:0;background:var(--surface-2);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:18px}
main{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:104px}
.tile:hover{border-color:var(--primary)}
.tile .ic{font-size:24px}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.es{background:color-mix(in srgb,var(--es) 15%,transparent);color:var(--es)}
.pill.en{background:color-mix(in srgb,var(--en) 15%,transparent);color:var(--en)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
label.f{display:block;margin:10px 0}
label.f > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:44px}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%}
.check{display:flex;gap:10px;align-items:center;margin:8px 0;cursor:pointer}
.check input{width:20px;height:20px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--primary)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px}
.item .d{font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .2s}
.crit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:10px 0}
.crit .n{font-weight:600;font-size:14px}
.crit .v{font-weight:700;font-variant-numeric:tabular-nums}
.crit .bar{grid-column:1/-1}
.crit .c{grid-column:1/-1;font-size:13px;color:var(--muted)}
.big-score{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stage{text-align:center;padding:22px 16px}
.stage .who{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stage .state{font-size:22px;font-weight:700;margin:8px 0}
.stage .dir{margin:6px 0 2px}
.meter{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:14px auto;max-width:420px}
.meter i{display:block;height:100%;width:0;background:var(--rec);transition:width .06s}
.live{min-height:48px;color:var(--muted);font-size:15px;text-align:left;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px;white-space:pre-wrap}
.src{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:15.5px;line-height:1.6}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.ok{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
table.e{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.e th,table.e td{border-top:1px solid var(--border);padding:7px 6px;text-align:left;vertical-align:top}
table.e th{font-size:12px;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
details{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
.flash{font-size:28px;font-weight:700;text-align:center;margin:14px 0}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:0}
.chk .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:grid;place-items:center;font-size:14px}
.chk.done .box{background:var(--good);border-color:var(--good);color:#fff}
.spinner{width:28px;height:28px;border:3px solid var(--surface-2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
svg text{fill:var(--muted);font-size:11px}
@media (max-width:560px){
  main{padding:12px}
  .big-score{font-size:46px}
  .stage .state{font-size:19px}
}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" aria-label="Inicio" title="Inicio">⌂</button>
  <h1 id="title">InterpJud · Oral</h1>
  <button class="iconbtn" id="settingsBtn" aria-label="Ajustes" title="Ajustes">⚙</button>
</header>
<main id="view"></main>
<script type="module" src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Nueva versión instalada: recargar si estás en una pantalla tranquila.
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) return;
    const h = (location.hash.slice(1) || "home").split("/")[0];
    if (["home", "ajustes", "progreso", "criterios"].includes(h)) location.reload();
  });
}
</script>
</body>
</html>
